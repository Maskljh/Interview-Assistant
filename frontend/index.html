<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171717" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="模拟面试" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <title>模拟面试助手</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/TXIVHSDK_Web_Cloud_V5.4.2_Release.js"></script>
    <!-- pdfjs-dist 引用 Iterator 全局（iterator helpers 提案特性），旧版 Android
         WebView 无此对象会在模块加载时抛 ReferenceError 导致白屏。
         最小 polyfill：仅保证 Iterator 存在；pdfjs 检测到 join 缺失会自行安装实现。 -->
    <script>
      if (typeof Iterator === 'undefined') {
        window.Iterator = { prototype: {} };
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
